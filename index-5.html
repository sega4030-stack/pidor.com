<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДяДя Саша</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  #screen {
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #hint {
    color: rgba(255,255,255,0.15);
    font-family: sans-serif;
    font-size: 18px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  body.playing #hint { opacity: 0; }
</style>
</head>
<body>
<div id="screen">
  <span id="hint">нажми куда угодно</span>
</div>
<audio id="audio" loop preload="auto">
  <source src="diadia-sasha-10x.mp3" type="audio/mpeg">
</audio>
<script>
  const audio = document.getElementById('audio');
  let started = false;

  function startAudio() {
    if (!started) {
      audio.play();
      started = true;
      document.body.classList.add('playing');

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'ДяДя Саша' });
        const noop = () => {};
        navigator.mediaSession.setActionHandler('play', noop);
        navigator.mediaSession.setActionHandler('pause', noop);
        navigator.mediaSession.setActionHandler('stop', noop);
        navigator.mediaSession.setActionHandler('previoustrack', noop);
        navigator.mediaSession.setActionHandler('nexttrack', noop);
      }
    }
  }

  document.addEventListener('visibilitychange', function() {
    if (started && audio.paused) audio.play();
  });

  audio.addEventListener('pause', function() {
    if (started) setTimeout(() => { if (audio.paused) audio.play(); }, 300);
  });

  document.body.addEventListener('click', startAudio);
  document.body.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startAudio();
  }, { passive: false });
</script>
</body>
</html>
